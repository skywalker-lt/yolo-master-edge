# XcodeGen spec for the YOLO-Master iOS app.
#   brew install xcodegen && cd ios && xcodegen   ->  YOLOMasterIOS.xcodeproj
# The inference backend is the SAME YOLOMasterKit the macOS CLI/GUI use, pulled
# as a local Swift package from ../mac.
name: YOLOMasterIOS
options:
  bundleIdPrefix: dev.yolomaster
  deploymentTarget:
    iOS: "17.0"
packages:
  YOLOMaster:
    path: ../mac
targets:
  YOLOMasterIOS:
    type: application
    platform: iOS
    sources:
      - App
      # group (NOT folder reference): members are individual files, so Xcode's
      # coremlc compiles each .mlpackage into a bundle-root .mlmodelc
      - path: Models
        optional: true
      # Icon Composer output (Xcode 26). Kept OUTSIDE App so the App group scan
      # never recurses into this file-package; declared explicitly as a resource.
      - path: AppIcon.icon
        buildPhase: resources
        optional: true
      # About-page logos (folder reference -> bundled as "ack/" subdirectory,
      # loaded via Bundle.main.url(forResource:withExtension:subdirectory:"ack")).
      - path: Resources/ack
        type: folder
        buildPhase: resources
        optional: true
      # Privacy manifest: declares the one required-reason API the app uses
      # (UserDefaults, through @AppStorage). NOT optional - App Store Connect
      # rejects an upload without it, so xcodegen must fail if it goes missing.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: YOLOMaster
        product: YOLOMasterKit
    # Debug builds stay lenient (AppIcon.icon and Models are optional above, so
    # a fresh clone still generates and runs). A Release build is what gets
    # archived and uploaded: it must carry the inputs that are NOT in git, and
    # a silent build without them is how an icon-less app reaches App Store
    # Connect. Fail loudly instead.
    preBuildScripts:
      - name: Release inputs guard
        basedOnDependencyAnalysis: false
        script: |
          [ "${CONFIGURATION}" = "Release" ] || exit 0
          fail=0
          if [ ! -d "${SRCROOT}/AppIcon.icon" ]; then
            echo "error: ios/AppIcon.icon is missing. A Release build needs the app icon (Icon Composer package); it is not in git."
            fail=1
          fi
          if [ -z "$(find "${SRCROOT}/Models" -maxdepth 1 \( -name '*.mlpackage' -o -name '*.mlmodelc' \) -print 2>/dev/null | head -n 1)" ]; then
            echo "error: ios/Models/ holds no Core ML model. See ios/README.md for where the models come from."
            fail=1
          fi
          exit "${fail}"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: YOLO-Master
        CFBundleName: YOLO-Master
        CFBundleShortVersionString: "1.1.0"   # marketing version (the About card reads it from the bundle)
        CFBundleVersion: "2"                    # build number - MUST increment every upload (1 = the TestFlight build of 2026-08-26)
        ITSAppUsesNonExemptEncryption: false    # only HTTPS/system crypto -> skips the export-compliance prompt
        UILaunchScreen: {}
        NSCameraUsageDescription: "Live object detection uses the camera."
        # No NSPhotoLibraryUsageDescription on purpose: photos arrive through the
        # system picker, which needs no library permission. Only saving needs one
        # (add-only). Do not call PHPhotoLibrary with .readWrite without restoring
        # that key - iOS kills the app on a permission request with no usage string.
        NSPhotoLibraryAddUsageDescription: "Saves captured detection frames to your photo library."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Core ML packages are DIRECTORIES. iOS presents a directory as one selectable
        # document only when a package type is declared for its extension; without these
        # the custom-model importer in Settings could not select a .mlpackage or .mlmodelc
        # (Files showed them as folders). Imported, not exported: the types are Apple's.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.coreml.mlpackage
            UTTypeDescription: Core ML Model Package
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [mlpackage]
          - UTTypeIdentifier: com.apple.coreml.mlmodelc
            UTTypeDescription: Compiled Core ML Model
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [mlmodelc]
          - UTTypeIdentifier: com.apple.coreml.model
            UTTypeDescription: Core ML Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mlmodel]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the Release inputs guard above reads paths under SRCROOT that are not
        # declared script inputs; a sandboxed script would see them as missing
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # set your team for device deploys:  DEVELOPMENT_TEAM: XXXXXXXXXX
